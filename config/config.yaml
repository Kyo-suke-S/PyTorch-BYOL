network:
  name: resnet18

  # Specify a folder containing a pre-trained model to fine-tune. If training from scratch, pass None.
  fine_tune_from: 'resnet-18_40-epochs'

  projection_head:
    mlp_hidden_size: 512
    projection_size: 128

  encoded_img_size: 14

data_transforms:
  s: 1
  input_shape: (224,224,3)

trainer:
  batch_size: 128
  m: 0.996 # momentum update
  checkpoint_interval: 5000
  max_epochs: 100
  num_workers: 4
  no_tqdm: True
  atten_lambda: 0.01

optimizer:
  params:
    lr: 0.03
    momentum: 0.9
    weight_decay: 0.0004

data:
  dataset_name: 'imagenet-100'
  data_dir: '/home/shirota/ImageNet-100/train'

method: 'byol_atten'
atten_type: 'Dot'
dim_atten: 128

seed: 2